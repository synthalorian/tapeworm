[package]
name = "tapeworm"
version = "1.0.0"
edition = "2021"
description = "TUI log file analyzer -- htop for logs"
license = "Apache-2.0"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"
csv = "1.3"

[dev-dependencies]
tempfile = "3.10"
